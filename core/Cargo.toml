[package]
name = "baskul-core"
version.workspace = true
edition.workspace = true
description = "Cœur de Baskul : réseau, protocole, logique de la principale et des pilotées, presse-papiers, configuration"
license.workspace = true
publish = false

[lib]
name = "baskul_core"
path = "src/lib.rs"

[dependencies]
arboard = "3.7.0"
blake2 = "0.11.0"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
getrandom = "0.4.3"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
log = "0.4.34"
mdns-sd = { version = "0.21.6", default-features = false, features = ["logging"] }
png = "0.18.1"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = "0.10.0"
socket2 = "0.6.1"
sys-locale = "0.3.2"
toml = "1.1.8"
toml_edit = "0.25.17"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
