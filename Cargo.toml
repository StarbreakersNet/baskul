[workspace]
members = [".", "app/src-tauri"]
resolver = "3"

# Version commune au daemon et à l'app de réglages.
[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"

[package]
name = "baskul"
version.workspace = true
edition.workspace = true
description = "Un clavier, une souris et un presse-papiers partagés entre plusieurs ordinateurs"
license.workspace = true
publish = false

[[bin]]
name = "baskul"
path = "src/main.rs"

[dependencies]
arboard = "3.7.0"
blake2 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
getrandom = "0.4.3"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
log = "0.4.34"
mdns-sd = { version = "0.21.6", default-features = false, features = ["logging"] }
png = "0.18.1"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
snow = "0.10.0"
socket2 = "0.6.1"
sys-locale = "0.3.2"
toml = "1.1.8"
toml_edit = "0.25.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

# Dépendances utilisées uniquement pour vérifier (cargo check) le code Windows
# et macOS depuis Linux, via la feature `xcheck`. Jamais utilisées pour un
# vrai build.
[target.'cfg(target_os = "linux")'.dependencies]
block2 = { version = "0.6", features = ["gnustep-2-1"], optional = true }
libc = { version = "0.2", optional = true }
objc2 = { version = "0.6.5", features = ["gnustep-2-1"], optional = true }
objc2-app-kit = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
# Vérification croisée du code plateforme depuis Linux (voir scripts/xcheck.sh).
xcheck = [
    "dep:block2",
    "dep:libc",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:windows-sys",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
