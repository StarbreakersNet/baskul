[package]
name = "bascule-settings"
version.workspace = true
edition.workspace = true
description = "Réglages de Bascule (interface Tauri + Vue 3)"
license.workspace = true
publish = false

[[bin]]
name = "bascule-settings"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

[features]
# Activée pour les versions distribuées : le front est servi depuis
# l'exécutable au lieu du serveur de développement Vite.
custom-protocol = ["tauri/custom-protocol"]
