# L'app Baskul : un seul exécutable. Elle héberge Baskul (couche système et
# cœur, crate baskul-desktop), son icône dans la barre des menus ou la zone
# de notification, et la fenêtre de réglages (Vue 3, dans app/src).
[package]
name = "baskul"
version.workspace = true
edition.workspace = true
description = "Un clavier, une souris et un presse-papiers partagés entre plusieurs ordinateurs"
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "baskul"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
baskul-desktop = { path = "../.." }
log = "0.4.34"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# Activée pour les versions distribuées : le front est servi depuis
# l'exécutable au lieu du serveur de développement Vite.
custom-protocol = ["tauri/custom-protocol"]
