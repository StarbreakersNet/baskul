name: checks

# Format, lint, tests et types, pour le Rust et le front (docs/conventions/),
# et messages des commits d'une PR (docs/conventions/commits.md).
# À chaque PR et sur main ; build et release les reprennent.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  CARGO_TERM_COLOR: always

jobs:
  commits:
    name: Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Titre passé par l'environnement : il vient de l'auteur de la PR
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commits.mjs "$BASE" "$HEAD" "$TITLE"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
      - run: cargo fmt --all --check
      - run: cargo clippy -p baskul-core -p baskul-desktop --all-targets -- -D warnings
      - run: cargo test -p baskul-core -p baskul-desktop
      # Code Windows et macOS, vérifié depuis Linux
      - run: ./scripts/xcheck.sh

  front:
    name: Front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - run: yarn install --immutable
      # Vérifie sans corriger, contrairement à yarn lint
      - name: Format (Prettier)
        run: yarn prettier --check src/ tests/
      - name: Lint (oxlint)
        run: yarn oxlint src -D correctness --import-plugin -D import/first
      - name: Lint (ESLint)
        run: yarn eslint .
      - name: Noms de fichiers
        run: yarn lint:names
      - name: Types
        run: yarn type-check
      - name: Tests (utils, traductions)
        run: yarn test
