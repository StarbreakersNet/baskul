name: build

# Programmes de Windows, macOS et Linux, dans les "artifacts" de l'exécution.
#
# À la main (onglet Actions → build → Run workflow) : build de test, rapide.
# Un seul système au choix, macOS pour Apple Silicon seulement, optimisations
# allégées (sans LTO). Les vérifications (checks.yml) tournent en parallèle.
#
# Appelé par release.yml avec les réglages d'une version publiée : les trois
# systèmes, macOS universel, optimisations complètes, tests sur chaque système.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Systèmes à compiler
        type: choice
        options: [tous, windows, macos, linux]
        default: tous
      universal:
        description: macOS universel (Apple Silicon et Intel, deux fois plus long)
        type: boolean
        default: false
      release_profile:
        description: Optimisations complètes, comme une version publiée (plus long)
        type: boolean
        default: false
  workflow_call:
    inputs:
      platforms:
        type: string
        default: tous
      universal:
        type: boolean
        default: true
      release_profile:
        type: boolean
        default: true
      native_tests:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  CARGO_TERM_COLOR: always
  # Build de test : sans LTO et compilé en parallèle, plusieurs fois plus rapide à produire
  CARGO_PROFILE_RELEASE_LTO: ${{ inputs.release_profile && 'thin' || 'false' }}
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.release_profile && '1' || '16' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  linux:
    name: Linux
    if: inputs.platforms == 'tous' || inputs.platforms == 'linux'
    # Ubuntu 22.04 : les binaires fonctionnent aussi sur les versions récentes.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-linux-${{ inputs.release_profile }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev
          version: 1
      - run: ./scripts/build-linux.sh
      # L'app Tauri n'est compilable que sur un système avec WebKitGTK : son lint est ici
      - run: cargo clippy -p baskul --features custom-protocol -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: Baskul-Linux
          path: dist/Baskul-Linux.tar.gz

  windows:
    name: Windows
    if: inputs.platforms == 'tous' || inputs.platforms == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-windows-${{ inputs.release_profile }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - if: inputs.native_tests
        run: cargo test -p baskul-core -p baskul-desktop
      - run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Baskul-Windows
          path: dist/Baskul-Windows.zip

  macos:
    name: macOS
    if: inputs.platforms == 'tous' || inputs.platforms == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.universal && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-macos-${{ inputs.universal }}-${{ inputs.release_profile }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - if: inputs.native_tests
        run: cargo test -p baskul-core -p baskul-desktop
      # Signature avec le certificat de Baskul (secrets MACOS_CERTIFICATE et
      # MACOS_CERTIFICATE_PASSWORD) : l'identité de l'app reste la même d'une
      # version à l'autre, et macOS conserve ses autorisations (Accessibilité,
      # Surveillance de l'entrée) après une mise à jour. Sans ces secrets
      # (fork…), signature ad hoc : les autorisations sont redemandées à
      # chaque version.
      - name: Certificat de signature
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::secret MACOS_CERTIFICATE absent : signature ad hoc, macOS redemandera les autorisations après la mise à jour"
            exit 0
          fi
          keychain="$RUNNER_TEMP/baskul.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/baskul.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/baskul.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/baskul.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Certificat auto-signé, non approuvé sur la machine de build :
          # désigné par son empreinte SHA-1 (son nom ne suffit pas).
          identity=$(security find-identity -p codesigning "$keychain" | awk '/[0-9]+\)/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::aucune identité de signature dans MACOS_CERTIFICATE"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - run: ./scripts/build-macos.sh
        env:
          UNIVERSAL: ${{ inputs.universal && '1' || '0' }}
      - name: Signature
        run: codesign --display --requirements - dist/Baskul.app
      - uses: actions/upload-artifact@v4
        with:
          name: Baskul-macOS
          path: dist/Baskul-macOS.zip
