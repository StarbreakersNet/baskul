name: build

# Se lance uniquement quand un tag est poussé (par exemple `v0.3.0`), et publie
# alors une Release. « Run workflow » (onglet Actions) compile sans publier.
on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Yarn 4 est installé par corepack (champ packageManager de app/package.json).
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  tests:
    name: Tests (Linux) + vérification du code Windows/macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo test -p bascule
      - run: cargo clippy -p bascule --all-targets -- -D warnings
      - run: ./scripts/xcheck.sh

  linux:
    name: Linux
    # Ubuntu 22.04 : les binaires fonctionnent aussi sur les versions récentes.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: ./scripts/build-linux.sh
      - run: cargo clippy -p bascule-settings --features custom-protocol -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: Bascule-Linux
          path: dist/Bascule-Linux.tar.gz

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test -p bascule
      - run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Bascule-Windows
          path: dist/Bascule-Windows.zip

  macos:
    name: macOS (universel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test -p bascule
      - run: UNIVERSAL=1 ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bascule-macOS
          path: dist/Bascule-macOS.zip

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [tests, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Si la Release a été créée depuis l'interface de GitHub (ce qui crée
      # aussi le tag), on y ajoute seulement les fichiers.
      - run: |
          files=(
            artifacts/Bascule-Windows/Bascule-Windows.zip
            artifacts/Bascule-macOS/Bascule-macOS.zip
            artifacts/Bascule-Linux/Bascule-Linux.tar.gz
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Bascule $GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
