name: build

# Se lance quand un tag est poussé (par exemple `0.4.0`), et publie alors une
# Release. « Run workflow » (onglet Actions) compile ; avec « Publier une
# Release » coché, il crée aussi le tag (version de Cargo.toml) et la Release.
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publier une Release (tag = version de Cargo.toml)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Yarn 4 est installé par corepack (champ packageManager de app/package.json).
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # Les builds (longs, surtout sur macOS) ne démarrent que si les tests passent.
  tests:
    name: Tests (Linux) + vérification du code Windows/macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo test -p bascule
      - run: cargo clippy -p bascule --all-targets -- -D warnings
      - run: ./scripts/xcheck.sh

  linux:
    name: Linux
    needs: tests
    # Ubuntu 22.04 : les binaires fonctionnent aussi sur les versions récentes.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: ./scripts/build-linux.sh
      - run: cargo clippy -p bascule-settings --features custom-protocol -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: Bascule-Linux
          path: dist/Bascule-Linux.tar.gz

  windows:
    name: Windows
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test -p bascule
      - run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Bascule-Windows
          path: dist/Bascule-Windows.zip

  macos:
    name: macOS (universel)
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test -p bascule
      - run: UNIVERSAL=1 ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bascule-macOS
          path: dist/Bascule-macOS.zip

  release:
    name: Release
    if: github.ref_type == 'tag' || inputs.release
    needs: [tests, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Tag poussé : son nom. Lancement manuel : la version de Cargo.toml ; le
      # tag est alors créé sur ce commit avec la Release.
      # Si la Release existe déjà (créée depuis l'interface de GitHub, par
      # exemple), on y ajoute seulement les fichiers.
      - run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          fi
          files=(
            artifacts/Bascule-Windows/Bascule-Windows.zip
            artifacts/Bascule-macOS/Bascule-macOS.zip
            artifacts/Bascule-Linux/Bascule-Linux.tar.gz
          )
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
              --title "Bascule $tag" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
