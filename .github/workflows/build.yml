name: build

# Se lance uniquement quand un tag est poussé (par exemple `v0.2.0`), et publie
# alors une Release. « Run workflow » (onglet Actions) compile sans publier.
on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Linux) + vérification du code Windows/macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: ./scripts/xcheck.sh

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: Bascule-Windows
          path: target/release/bascule.exe

  macos:
    name: macOS (universel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test
      - run: UNIVERSAL=1 ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bascule-macOS
          path: dist/Bascule-macOS.zip

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [tests, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Si la Release a été créée depuis l'interface de GitHub (ce qui crée
      # aussi le tag), on y ajoute seulement les fichiers.
      - run: |
          files=(artifacts/Bascule-Windows/bascule.exe artifacts/Bascule-macOS/Bascule-macOS.zip)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Bascule $GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
