name: build

# Tests puis compilation pour Windows, macOS et Linux ; les programmes sont
# dans les « artifacts » de l'exécution. Se lance à la main (onglet Actions →
# build → Run workflow) et sert aussi au workflow « release ».
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # Yarn 4 est installé par corepack (champ packageManager de app/package.json).
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # Les builds (longs, surtout sur macOS) ne démarrent que si les tests passent.
  tests:
    name: Tests (Linux) + vérification du code Windows/macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo test -p baskul
      - run: cargo clippy -p baskul --all-targets -- -D warnings
      - run: ./scripts/xcheck.sh

  linux:
    name: Linux
    needs: tests
    # Ubuntu 22.04 : les binaires fonctionnent aussi sur les versions récentes.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: ./scripts/build-linux.sh
      - run: cargo clippy -p baskul-settings --features custom-protocol -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: Baskul-Linux
          path: dist/Baskul-Linux.tar.gz

  windows:
    name: Windows
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test -p baskul
      - run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Baskul-Windows
          path: dist/Baskul-Windows.zip

  macos:
    name: macOS (universel)
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test -p baskul
      - run: UNIVERSAL=1 ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Baskul-macOS
          path: dist/Baskul-macOS.zip
