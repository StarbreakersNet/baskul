name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Linux) + vérification du code Windows/macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: ./scripts/xcheck.sh

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: Bascule-Windows
          path: target/release/bascule.exe

  macos:
    name: macOS (universel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test
      - run: UNIVERSAL=1 ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bascule-macOS
          path: dist/Bascule-macOS.zip
